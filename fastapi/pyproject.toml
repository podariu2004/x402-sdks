[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402-fastapi"
version = "0.1.0"
description = "Thin FastAPI client for the x402 paywall platform (X402v1 wire contract)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "starlette>=0.36"]

[project.urls]
Homepage = "https://payrelayer.com"
Repository = "https://github.com/podariu2004/paywall"
Documentation = "https://payrelayer.com/for-developers"

[tool.hatch.build.targets.wheel]
packages = ["x402_fastapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
